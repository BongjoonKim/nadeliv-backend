name: Deploy to EC2

on:
  push:
    branches: [ production ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: |
          ./gradlew build -x test  # 테스트를 제외하고 빌드
          ./gradlew build

      - name: Deploy to EC2
        env:
          PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          HOST: ${{ secrets.EC2_HOST }}
          USER: ${{ secrets.EC2_USER }}
          MONGODB_PASSWORD: ${{ secrets.MONGODB_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          WEATHER_API_KEY: ${{ secrets.WEATHER_API_KEY }}
          OPEN_AI_KEY: ${{ secrets.OPEN_AI_KEY }}
          NAVER_MAP_CLIENT_ID: ${{ secrets.NAVER_MAP_CLIENT_ID }}
          NAVER_MAP_CLIENT_SECRET: ${{ secrets.NAVER_MAP_CLIENT_SECRET }}
          KAKAO_API_KEY: ${{ secrets.KAKAO_API_KEY }}
          REDIS_HOST: ${{secrets.REDIS_HOST}}
          AWS_BEDROCK_MODEL_ID: ${{ secrets.AWS_BEDROCK_MODEL_ID }}
          SES_SNS_SECRET_TOKEN: ${{ secrets.SES_SNS_SECRET_TOKEN }}
          SES_SNS_TOPIC_ARN: ${{ secrets.SES_SNS_TOPIC_ARN }}
          SES_CONFIGURATION_SET: ${{ secrets.SES_CONFIGURATION_SET }}
          SES_INBOUND_SECRET_TOKEN: ${{ secrets.SES_INBOUND_SECRET_TOKEN }}
        run: |
          # SSH 키 설정
          echo "$PRIVATE_KEY" > private_key.pem
          chmod 600 private_key.pem
          
          # SSH 설정 (호스트 키 확인 비활성화)
          mkdir -p ~/.ssh
          ssh-keyscan -H $HOST >> ~/.ssh/known_hosts
          
          # 빌드된 JAR 파일 EC2로 복사
          scp -i private_key.pem build/libs/nadeliv-0.0.1-SNAPSHOT.jar $USER@$HOST:~/nadeliv-back/build/libs/
          
          # start.sh 파일을 먼저 로컬에서 생성 (프로파일 설정 제거)
          cat > start.sh << 'STARTSCRIPT'
          #!/bin/bash
          APP_DIR="/home/ubuntu/nadeliv-back"
          JAR_FILE="$APP_DIR/build/libs/nadeliv-0.0.1-SNAPSHOT.jar"
          LOG_DIR="$APP_DIR/logs"
          PID_FILE="$APP_DIR/app.pid"
          CONFIG_FILE="$APP_DIR/application.yml"
          
          mkdir -p $LOG_DIR
          
          # 기존 프로세스 종료
          if [ -f $PID_FILE ]; then
            OLD_PID=$(cat $PID_FILE)
            if ps -p $OLD_PID > /dev/null 2>&1; then
              echo "Stopping old process (PID: $OLD_PID)..."
              kill -9 $OLD_PID
              sleep 2
            fi
          fi
          
          # 포트 확인 및 종료
          PORT_PID=$(lsof -ti:3003 2>/dev/null)
          if [ ! -z "$PORT_PID" ]; then
            echo "Killing process using port 3003: $PORT_PID"
            kill -9 $PORT_PID
            sleep 2
          fi
          
          # 애플리케이션 시작 (외부 설정 파일 사용)
          echo "Starting Nadeliv application..."
          if [ -f $CONFIG_FILE ]; then
            echo "Using external config file: $CONFIG_FILE"
            nohup java -Xmx512m -Xms256m \
              -jar $JAR_FILE \
              --spring.config.location=$CONFIG_FILE > $LOG_DIR/nadeliv.log 2>&1 &
          else
            echo "Using default config"
            nohup java -Xmx512m -Xms256m \
              -jar $JAR_FILE > $LOG_DIR/nadeliv.log 2>&1 &
          fi
          
          # PID 저장
          echo $! > $PID_FILE
          echo "Application started with PID: $(cat $PID_FILE)"
          echo "Logs: $LOG_DIR/nadeliv.log"
          STARTSCRIPT
          
          # start.sh를 EC2로 복사
          scp -i private_key.pem start.sh $USER@$HOST:~/nadeliv-back/
          rm -f start.sh
          
          # EC2에서 배포 실행
          ssh -i private_key.pem $USER@$HOST << ENDSSH
            cd ~/nadeliv-back

            # 로그 디렉토리 생성 (없는 경우)
            mkdir -p ~/nadeliv-back/logs

            # src/main/resources 디렉토리 생성
            mkdir -p ~/nadeliv-back/src/main/resources

            # application.yml 파일 생성 (기본 설정 파일로 사용)
            cat > ~/nadeliv-back/application.yml << APPCONFIG
          server:
            port: 3003
          
          spring:
            application:
              name: nadeliv
            servlet:
              multipart:
                max-file-size: 500MB
                max-request-size: 800MB
            data:
              mongodb:
                host: 3.36.175.230
                port: 27017
                username: haries
                password: ${MONGODB_PASSWORD}
                database: nadeliv
              redis:
                host: ${REDIS_HOST}
                port: 6379
                timeout : 5000ms
            weather:
              url: https://api.openweathermap.org/data/2.5/weather
              key: ${WEATHER_API_KEY}
            openai:
              translation:
                model: gpt-5-mini-2025-08-07
                cache:
                  enabled: true
              url: https://api.openai.com/v1/chat/completions
              key: ${OPEN_AI_KEY}
            naver:
              map:
                client-id: ${NAVER_MAP_CLIENT_ID}
                client-secret: ${NAVER_MAP_CLIENT_SECRET}
                geocode:
                  url:
            kakao:
              api: ${KAKAO_API_KEY}
          jwt:
            secretKey: ${JWT_SECRET}
            expiration: 200000
          front:
            url:
              local: http://localhost:3002
              prod: https://nadeliv.com
          
          cloud:
            aws:
              region:
                static: ap-northeast-2
              bedrock:
                model-id: ${AWS_BEDROCK_MODEL_ID}
              ses:
                region: ap-northeast-2
                from-email: noreply@nadeliv.com
                configuration-set: "${SES_CONFIGURATION_SET}"
                notifications:
                  secret-token: "${SES_SNS_SECRET_TOKEN}"
                  allowed-topic-arn: "${SES_SNS_TOPIC_ARN}"
                inbound:
                  secret-token: "${SES_INBOUND_SECRET_TOKEN}"

          # 액추에이터 설정 (헬스체크용)
          management:
            endpoints:
              web:
                exposure:
                  include: health
                base-path: /actuator
            endpoint:
              health:
                show-details: always
          APPCONFIG
          
            # src/main/resources에도 복사 (빌드 시 포함되도록)
            cp ~/nadeliv-back/application.yml ~/nadeliv-back/src/main/resources/application.yml

            # build/resources/main 디렉토리가 있으면 거기에도 복사
            if [ -d ~/nadeliv-back/build/resources/main ]; then
              cp ~/nadeliv-back/application.yml ~/nadeliv-back/build/resources/main/
            fi

            # JAR 파일과 같은 위치에도 복사 (외부 설정 파일로 사용)
            cp ~/nadeliv-back/application.yml ~/nadeliv-back/build/libs/
          
            # Git pull (최신 코드 가져오기) - 루트 디렉토리에서
            echo "========================================="
            echo "Fetching latest code from git..."
            echo "========================================="
            cd ~/nadeliv-back
            git fetch --all
            git reset --hard origin/production
            git pull
          
            cd ~/nadeliv-back
          
            # 기존 프로세스 종료
            echo "========================================="
            echo "Stopping existing applications..."
            echo "========================================="
          
            # 기존 프로세스 종료 (권한 문제 해결)
            PIDS=\$(ps -ef | grep "nadeliv-0.0.1-SNAPSHOT.jar" | grep -v grep | awk '{print \$2}')
            if [ ! -z "\$PIDS" ]; then
              for PID in \$PIDS; do
                # 프로세스 소유자 확인 후 종료
                if ps -p \$PID > /dev/null 2>&1; then
                  echo "Attempting to kill process \$PID"
                  kill -9 \$PID 2>/dev/null || echo "Could not kill process \$PID (may need different permissions)"
                fi
              done
              sleep 2
            fi
          
            # 포트 3003을 사용 중인 프로세스 종료
            PORT_PID=\$(lsof -ti:3003 2>/dev/null)
            if [ ! -z "\$PORT_PID" ]; then
              echo "Killing process using port 3003: \$PORT_PID"
              kill -9 \$PORT_PID 2>/dev/null || echo "Could not kill process on port 3003"
              sleep 2
            fi
          
            # start.sh 실행 권한 부여
            chmod +x ~/nadeliv-back/start.sh
          
            # 스크립트 실행
            echo "========================================="
            echo "Starting application with start.sh..."
            echo "========================================="
            ./start.sh
          
            # 실행 확인 (시작까지 대기)
            sleep 10
          
            # PID 파일과 프로세스 확인
            if [ -f ~/nadeliv-back/app.pid ]; then
              PID=\$(cat ~/nadeliv-back/app.pid)
              if ps -p \$PID > /dev/null 2>&1; then
                echo "========================================="
                echo "✅ Application started successfully!"
                echo "========================================="
                echo "PID: \$PID"
          
                # 포트 확인
                sleep 2
                if lsof -Pi :3003 -sTCP:LISTEN -t > /dev/null 2>&1; then
                  echo "✅ Port 3003 is listening"
                  echo "Application URL: http://${HOST}:3003"
          
                  # 헬스체크 테스트
                  echo ""
                  echo "Testing health endpoints..."
                  curl -s http://localhost:3003/health > /dev/null 2>&1 && echo "✅ /health endpoint is responding" || echo "⚠️ /health endpoint not responding"
                  curl -s http://localhost:3003/actuator/health > /dev/null 2>&1 && echo "✅ /actuator/health endpoint is responding" || echo "⚠️ /actuator/health endpoint not responding"
                  curl -s http://localhost:3003/redis-test > /dev/null 2>&1 && echo "✅ Redis is working" || echo "❌ Redis connection failed"
                else
                  echo "⚠️ Warning: Port 3003 is not listening yet (may still be starting)"
                fi
          
                echo ""
                echo "Recent application logs:"
                tail -n 20 ~/nadeliv-back/logs/nadeliv.log || echo "Log file not available yet"
          
                echo ""
                echo "========================================="
                echo "✅ Deployment completed successfully!"
                echo "========================================="
              else
                echo "❌ Process died immediately after starting!"
                tail -n 50 ~/nadeliv-back/logs/nadeliv.log 2>/dev/null || echo "No logs available"
                exit 1
              fi
            else
              echo "❌ PID file not created - application failed to start!"
              if [ -f ~/nadeliv-back/logs/nadeliv.log ]; then
                tail -n 50 ~/nadeliv-back/logs/nadeliv.log
              fi
              exit 1
            fi
          ENDSSH
          
          # 키 파일 삭제
          rm -f private_key.pem